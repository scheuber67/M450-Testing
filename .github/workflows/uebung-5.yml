name: Uebung 5 - Backend Build und Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aufgaben/Übung 5/recipe-planner-fronend-and-backend/recipe-planner-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Aufgaben/Übung 5/recipe-planner-fronend-and-backend/recipe-planner-backend/pom.xml
      - name: Build
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile
      - name: Unit Tests und Reports
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Reports auch bei fehlgeschlagenen Tests erstellen
        if: failure()
        run: mvn --batch-mode --no-transfer-progress surefire-report:report-only jacoco:report
      - name: Reports pro Durchlauf speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uebung-5-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            Aufgaben/Übung 5/recipe-planner-fronend-and-backend/recipe-planner-backend/target/site/
            Aufgaben/Übung 5/recipe-planner-fronend-and-backend/recipe-planner-backend/target/reports/
            Aufgaben/Übung 5/recipe-planner-fronend-and-backend/recipe-planner-backend/target/surefire-reports/
          retention-days: 30
          if-no-files-found: warn
