name: Projekt - Build, Test und Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projekt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Projekt/pom.xml
      - name: JAR bauen
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: gutscheinrechner-jar
          path: Projekt/target/*.jar
          if-no-files-found: error

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projekt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Projekt/pom.xml
      - name: Unit- und Integrationstests mit HTML-Report
        run: mvn --batch-mode --no-transfer-progress verify
      - name: HTML-Report bei fehlgeschlagenen Tests erzeugen
        if: failure()
        run: mvn --batch-mode --no-transfer-progress surefire-report:report-only
      - name: Testresultate speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gutscheinrechner-testreports
          path: |
            Projekt/target/surefire-reports/
            Projekt/target/site/
          retention-days: 30
          if-no-files-found: warn
      - name: Website als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: gutscheinrechner-report-website
          path: Projekt/target/site/
          if-no-files-found: error

  deploy:
    name: Deploy Testreport
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: projekt-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gutscheinrechner-report-website
          path: public
      - name: Startseite fuer den Testreport erstellen
        run: cp public/surefire-report.html public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
